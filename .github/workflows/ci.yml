name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FormulaBolloApp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # mvnw está en git sin permiso de ejecución: se lanza con sh.
      # verify ejecuta los tests y el suelo de cobertura de JaCoCo.
      - run: sh ./mvnw -B verify

  # Las migraciones SQL no las ejecuta ningún test con H2 (colación, claves únicas y DELETE con JOIN
  # se comportan distinto): aquí se aplican V002 y su vuelta atrás sobre un MariaDB real.
  migrations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        # La misma versión que producción (cabecera del volcado de noviembre de 2026).
        image: mariadb:10.6.22
        env:
          MARIADB_ROOT_PASSWORD: ci-solo-pruebas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
      - run: bash FormulaBolloApp/db/migration/test/run_v002.sh
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PWD: ci-solo-pruebas

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FormulaBollo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FormulaBollo/package-lock.json
      - run: npm ci
      # Solo lo que llega a producción; las herramientas de desarrollo las vigila Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      # karma.ci.conf.js: ChromeHeadless sin sandbox (los runners de Ubuntu no dejan usar el sandbox de Chrome).
      - run: npx ng test --watch=false --browsers=ChromeHeadlessCI --karma-config=karma.ci.conf.js
      - run: npx ng build
