<div class="bg-canvas">
	<div class="flex-1 bg-canvas">
		<div class="my-container mx-auto py-8">
			<div class="flex">
				<p-button class="block shrink-0 lg:hidden menuButton pr-3" ariaLabel="Menú de administración" (click)="isAdminMenuOpen = !isAdminMenuOpen">
					@if (isAdminMenuOpen) {
						<i class="pi pi-chevron-left"></i>
					} @else {
						<i class="pi pi-bars"></i>
					}
				</p-button>
				<h1 class="font-display uppercase tracking-wide text-ink text-display-md mb-8 mt-1">Panel de administración</h1>
			</div>
			<div class="flex flex-col gap-y-4 lg:flex-row">
				<div class="lg:max-w-[220px] xl:max-w-[320px] w-full h-full shrink-0" [class]="isAdminMenuOpen ? 'block' : 'hidden'">
					<p-menu [model]="items" class="flex justify-center bg-panel border border-rule rounded-panel" styleClass="w-full">
						<ng-template #item let-item>
							<a
								class="flex items-center w-full rounded-row cursor-pointer text-ink-soft hover:bg-panel-alt hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2"
								[class.menu-item-selected]="isActive(item.routerLink)"
								[routerLink]="item.routerLink">
								<span [class]="item.icon"></span>
								<span class="ml-2">{{ item.label }}</span>
							</a>
						</ng-template>
					</p-menu>
				</div>
				<div class="flex-1 min-w-0" [class]="isAdminMenuOpen ? 'lg:ml-4' : ''">
					<router-outlet />
				</div>
			</div>
		</div>
	</div>
</div>
