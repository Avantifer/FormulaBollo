<section [id]="policyId()" class="rounded-panel border border-rule bg-panel-alt p-4 text-ink" aria-label="Requisitos de contraseña">
	<h3 class="font-display text-xl font-semibold uppercase">Tu contraseña</h3>
	<p class="mt-3 text-[11px]">Seguridad orientativa: <strong>{{ strength() }}</strong></p>
	<div class="mt-2 flex gap-1" aria-hidden="true">
		@for (bar of [1, 2, 3, 4]; track bar) {
			<span [class]="bar <= bars() ? 'h-1 flex-1 bg-fantasy' : 'h-1 flex-1 bg-rule'"></span>
		}
	</div>
	<ul class="mt-4 grid gap-2.5">
		@for (rule of rules(); track rule.label) {
			<li class="flex items-start gap-2 text-xs" [class.text-sector-up]="rule.good" [class.text-sector-down]="!rule.good" [attr.data-satisfied]="rule.good">
				<i class="pi mt-1" [class.pi-check-circle]="rule.good" [class.pi-times-circle]="!rule.good" aria-hidden="true"></i>
				<span class="text-ink"><span class="sr-only">{{ rule.good ? 'Cumplido: ' : 'Pendiente: ' }}</span>{{ rule.label }}<small class="mt-0.5 block text-[11px] text-ink-soft">{{ rule.detail }}</small></span>
			</li>
		}
	</ul>
</section>
