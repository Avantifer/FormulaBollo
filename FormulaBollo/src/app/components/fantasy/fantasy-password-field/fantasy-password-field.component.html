<div class="auth-field">
	<label class="mb-2 block text-[13px] font-semibold" [for]="fieldId()">{{ label() }}</label>
	<p-iconfield>
		<p-inputicon class="pi pi-lock text-ink-soft!" aria-hidden="true" />
		<input pInputText [id]="fieldId()" [formControl]="control()" [type]="visible() ? 'text' : 'password'" [autocomplete]="autocomplete()" [placeholder]="placeholder() || label()" [attr.aria-invalid]="!!error()" [attr.aria-describedby]="(describedBy() + (error() ? ' ' + fieldId() + '-error' : '')).trim() || null" class="h-12! w-full min-w-0 pr-14! text-base! aria-invalid:border-sector-down! md:text-sm!" />
		<p-inputicon class="right-0.5! top-0! mt-0! h-full!">
			<button type="button" class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-row text-ink-soft focus-visible:outline-2 focus-visible:outline-offset-2" [attr.aria-label]="(visible() ? 'Ocultar ' : 'Mostrar ') + label().toLowerCase()" [attr.aria-controls]="fieldId()" [attr.aria-pressed]="visible()" (click)="visible.set(!visible())">
				<i [class]="visible() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
			</button>
		</p-inputicon>
	</p-iconfield>
	@if (error()) {
		<p [id]="fieldId() + '-error'" class="auth-error mt-2 flex items-baseline gap-[7px] text-xs text-sector-down"><i class="pi pi-times-circle" aria-hidden="true"></i>{{ error() }}</p>
	}
</div>
