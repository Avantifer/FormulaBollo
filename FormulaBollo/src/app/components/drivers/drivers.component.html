<div class="bg-canvas">
	<div class="flex-1 bg-canvas">
		<div class="my-container mx-auto py-8">
			<race-details />
			<div class="bg-panel border border-rule rounded-panel relative">
				<div class="flex justify-between flex-col md:flex-row items-center px-2 pt-2 md:px-6 md:pt-6">
					<h1 class="font-display uppercase tracking-wide text-ink text-2xl md:text-display-md font-bold mb-2 ml-2 xs:mb-2">
						Clasificación de pilotos
					</h1>
					<div class="flex flex-col xs:flex-row flex-wrap gap-y-2 w-auto xs:w-full md:w-auto">
						<select-seasons (seasonChanged)="onSeasonChange($event)" class="flex-1" />
						<div class="flex flex-row mt-2 xs:mt-0">
							<p-selectbutton [options]="listOptions" [(ngModel)]="listValue" class="md:h-9 mr-2 xs:mx-1 md:mx-2" allowEmpty="false">
								<ng-template #item let-item>
									<i [class]="item.icon" style="font-size: 1rem"></i>
									<span class="sr-only">{{ item.value === 'grid' ? 'Cuadrícula' : 'Lista' }}</span>
								</ng-template>
							</p-selectbutton>
							<p-button label="Filtros" icon="pi pi-filter" class="rounded-md" (onClick)="showFilters = !showFilters" />
						</div>
					</div>
				</div>
				<teams-filters [season]="season" [showFilters]="showFilters" (selectedTeamsChanged)="selectedTeams = $event" />
				<p-divider [class]="showFilters ? 'mt-0!' : ''" />
				<h2 class="sr-only">Pilotos</h2>
				<drivers-teams-grid-table [listValue]="listValue" [season]="season" [selectedTeams]="selectedTeams" [type]="'Pilotos'" />
			</div>
		</div>
	</div>
</div>
