<div class="bg-canvas">
	<div class="my-container mx-auto py-8 min-w-0">
		<section class="bg-panel border border-rule rounded-panel min-w-0 p-3 md:p-6">
			<div class="flex flex-col items-start justify-between gap-4 md:flex-row md:items-center">
				<h1 class="font-display uppercase tracking-wide text-ink text-2xl md:text-display-md font-bold">Clasificación de pilotos</h1>
				<select-seasons class="block min-w-0 max-w-full md:ml-auto" variant="tabs" [initialSeasonNumber]="initialSeasonNumber" (seasonChanged)="onSeasonChange($event)" />
			</div>
			@if (seasonReady()) {
				<teams-filters variant="logos" [season]="season()" [initialSelectedTeams]="initialTeams()" (selectedTeamsChanged)="onTeamsChange($event)" />
			}
			<h2 class="sr-only">Pilotos</h2>
			@if (seasonReady()) {
				<app-drivers-ranking [season]="season()" [selectedTeams]="selectedTeams()" />
			}
		</section>
	</div>
</div>
