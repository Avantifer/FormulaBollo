<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mx-2 md:mx-0">
  @for (driverPoint of displayTop3; track $index) {
    <div
      class="w-full min-w-0 flex-col items-center justify-end"
      [class]="$index != 1 ? 'hidden md:flex' : 'flex'"
    >
      <div
        class="mb-4 rounded-full overflow-hidden border-4 bg-panel-alt shrink-0"
        [class]="'border-' + (driverPoint.driver.team.name | SpaceToUnderscore)"
        [ngClass]="$index === 1 ? 'size-36' : 'size-28'"
      >
        <img
          [alt]="driverPoint.driver.name"
          class="h-full w-full object-cover"
          [src]="imageService.getImageUrl(driverPoint.driver.driverImage)"
        >
      </div>
      <div class="w-full bg-panel border border-rule rounded-panel p-4 text-center">
        <p
          class="inline-flex items-center justify-center font-display tabular-nums text-lg font-bold size-8 rounded-full mb-2"
          [class]="'bg-' + (driverPoint.driver.team.name | SpaceToUnderscore) + ' on-' + (driverPoint.driver.team.name | SpaceToUnderscore)"
        >
          {{ driverPoint.driver.number }}
        </p>
        <h3 class="font-display uppercase text-2xl font-bold text-ink break-words">{{ driverPoint.driver.name }}</h3>
        <p class="flex items-center justify-center gap-2 text-sm text-ink-soft">
          <span aria-hidden="true" class="size-1.5 shrink-0 rounded-full" [class]="'bg-' + (driverPoint.driver.team.name | SpaceToUnderscore)"></span>
          {{ driverPoint.driver.team.name }}
        </p>
        <p class="mt-2 font-display tabular-nums text-display-md font-bold text-ink">
          {{ driverPoint.totalPoints }} puntos
        </p>
      </div>
      <div
        data-testid="podium-position"
        class="mt-2 w-full rounded-row flex items-center justify-center font-display tabular-nums text-display-lg font-bold"
        [class]="$index === 1 ? 'bg-accent text-on-accent border border-accent' : 'bg-pit text-on-pit border border-rule'"
        [ngClass]="{
          'h-16': $index === 0,
          'h-24': $index === 1,
          'h-12': $index === 2
        }"
      >
        {{ utilsService.getCustomPosition($index) }}º
      </div>
    </div>
  }
</div>
