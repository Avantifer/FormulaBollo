<h2 class="my-container font-display uppercase tracking-wide text-display-md font-bold mb-8 pt-8 text-left text-ink after:mt-3 after:block after:h-[3px] after:w-12 after:bg-accent after:content-['']">
	Clasificación de pilotos
</h2>
<div class="relative my-container flex flex-col justify-start m-auto md:block z-20">
	@if (loading()) {
		<div class="w-full flex justify-evenly">
			<p-skeleton height="13rem" class="mb-2 w-full sm:w-36 md:w-52 lg:w-72 hidden sm:block" />
			<p-skeleton height="13rem" class="mb-2 w-full sm:w-36 md:w-52 lg:w-72" />
			<p-skeleton height="13rem" class="mb-2 w-full sm:w-36 md:w-52 lg:w-72 hidden sm:block" />
		</div>
		<div class="mt-3">
			@for (item of 10 | skeletonItems; track $index) {
				<p-skeleton width="w-full" height="4.25rem" styleClass="mt-3" />
			}
		</div>
	}

	@if (loadError()) {
		<div role="alert" class="text-center p-4">
			<p>No se pudieron cargar los pilotos.</p>
			<button type="button" (click)="retry()" class="underline focus-visible:outline-2">Reintentar</button>
		</div>
	} @else if (!loading() && !driverPoints().length && !drivers().length) {
		<p role="status" class="text-center p-4">No hay pilotos para esta temporada.</p>
	}
	<app-top3-drivers [top3]="driverPoints().length ? top3DriverPoints : top3Drivers" />
	<app-top10-drivers [top10]="driverPoints().length ? driverPoints() : drivers()" />
</div>
