<div class="bg-panel-alt text-ink">
	<div class="my-container teams position-relative">
		<div>
			<h2 class="font-display uppercase tracking-wide text-display-md font-bold mb-8 pt-8 text-left text-ink after:mt-3 after:block after:h-[3px] after:w-12 after:bg-accent after:content-['']">Escuderías</h2>
		</div>
		<div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 content-center gap-4">
			@for (team of teams(); track $index) {
				<a
					class="focus-visible:outline-2 focus-visible:outline-offset-2 flex h-36 rounded-panel border border-rule cursor-pointer animation-cubic-03 bg-panel"
					[class]="'hover-bg-' + (team.name | SpaceToUnderscore)"
					[routerLink]="['/teams/' + teamNameSpaceToUnderScore(team.name)]">
					<img
						loading="lazy"
						width="96"
						height="96"
						[src]="imageService.getImageUrl(team.logoImage)"
						[alt]="team.name"
						[class.reverse-color]="team.name === 'Alpine' || team.name === 'AlphaTauri' || team.name === 'Aston Martin'"
						class="teams-schema-container-image m-auto w-24" />
				</a>
			}
			@if (loading()) {
				@for (item of 10 | skeletonItems; track $index) {
					<p-skeleton height="9rem" styleClass="rounded-panel" />
				}
			}
		</div>
		@if (loadError()) {
			<div role="alert" class="text-center p-4">
				<p>No se pudieron cargar las escuderías.</p>
				<button type="button" (click)="retry()" class="underline focus-visible:outline-2">Reintentar</button>
			</div>
		} @else if (!loading() && !teams().length) {
			<p role="status" class="text-center p-4">No hay escuderías para esta temporada.</p>
		}
		<div class="mt-8 pb-8 text-center">
			<a
				[routerLink]="['/teams']"
				class="inline-flex min-h-11 md:min-h-0 items-center text-accent-text hover:underline transition">
				Ver todas las escuderías
				<i class="pi pi-chevron-right ml-1 pt-1" style="font-size: 0.65rem"></i>
			</a>
		</div>
	</div>
</div>
