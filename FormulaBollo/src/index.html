<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<title>FormulaBollo</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="FormulaBollo: clasificaciones, resultados, estadísticas y Fantasy de nuestra liga de Fórmula 1." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Geist:wght@100..900&display=swap" rel="stylesheet" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<script>
			// Precarga la imagen principal de la portada sin esperar a que arranque Angular (mejora el LCP).
			// Las URLs deben coincidir con apiUrl de src/enviroments/enviroment.ts y enviroment.prod.ts.
			(function () {
				if (location.pathname !== '/' && location.pathname !== '/home') return;
				var api = location.hostname === 'localhost' ? 'http://localhost:8080' : 'https://formulabollo.es:8443';
				var link = document.createElement('link');
				link.rel = 'preload';
				link.as = 'image';
				link.href = api + '/intro/introImage.avif';
				link.setAttribute('fetchpriority', 'high');
				document.head.appendChild(link);
			})();
		</script>
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
