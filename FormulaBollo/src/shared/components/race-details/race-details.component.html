@if (raceActual() && raceActual()?.id != null) {
	<div class="bg-pit text-on-pit border-l-4 border-accent rounded-panel p-4 mb-8">
		<div class="flex flex-col md:flex-row justify-between items-center">
			<div class="flex items-center gap-3 w-full">
				<div class="flex shrink-0 bg-panel-alt text-accent-text rounded-row p-1 md:p-2">
					<i class="pi pi-calendar" style="font-size: 1.25rem"></i>
				</div>
				<div>
					<p class="font-display uppercase text-base font-bold text-on-pit">Próxima carrera: GP de {{ raceActual()?.name }}</p>
					<p class="text-xs text-on-pit/80">
						<i class="pi pi-clock" style="font-size: 0.75rem"></i>
						{{ countdownText() }}
					</p>
				</div>
			</div>
			<div class="text-center mt-2 md:mt-0">
				<div class="font-display text-xs uppercase tracking-wider text-on-pit/80">Ronda</div>
				<div class="font-display tabular-nums text-2xl font-bold text-on-pit">{{ raceActual()!.id + 1 - races()[0].id }}/{{ races().length }}</div>
			</div>
		</div>
	</div>
}
