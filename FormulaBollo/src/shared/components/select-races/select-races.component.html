<form [formGroup]="racesForm">
	<p-select
		formControlName="race"
		[options]="races()"
		optionLabel="name"
		dataKey="name"
		[ariaLabelledBy]="labelId()"
		class="text-sm w-full min-w-[184px]">
		<ng-template pTemplate="item" let-race>
			<div class="flex items-center gap-2">
				@if (race.name === racesForm.get('race')?.value.name) {
					<i class="pi pi-check" style="font-size: 14px"></i>
				} @else {
					<div class="w-[14px]"></div>
				}
				<div>{{ race.name }}@if (fantasy && race.id !== 0 && !race.finished) { · Sin datos}</div>
			</div>
		</ng-template>
	</p-select>
</form>
