@if (showFilters()) {
	<div class="bg-panel-alt border-y border-rule flex gap-2 mt-4 p-4 overflow-x-auto whitespace-nowrap">
		<p-chip
			class="min-h-11 md:min-h-0 px-2.5! py-0.5! border-1 border-accent cursor-pointer select-none"
			(click)="toggleSelection('Todos los equipos')"
			onkeypress="toggleSelection('Todos los equipos')"
			[ngClass]="{
				'bg-accent!': isSelected('Todos los equipos')
			}">
			<div class="h-2 w-2 rounded-full bg-accent" [ngClass]="{ 'bg-on-accent!': isSelected('Todos los equipos') }"></div>
			<span class="text-xs font-bold" [class.text-on-accent]="isSelected('Todos los equipos')">Todos los equipos </span>
		</p-chip>
		@for (teamName of teamsName(); track $index) {
			<p-chip
				class="min-h-11 md:min-h-0 px-2.5! py-0.5! border-1 cursor-pointer select-none"
				[class]="'border-' + (teamName | SpaceToUnderscore)"
				(click)="toggleSelection(teamName)"
				onkeypress="toggleSelection(teamName)"
				[ngClass]="getTeamClass(teamName)">
				<div
					class="h-2 w-2 rounded-full"
					[class]="'bg-' + (teamName | SpaceToUnderscore)"
					[ngClass]="{ 'bg-on-accent!': isSelected(teamName) }"></div>
				<span class="text-xs font-bold"> {{ teamName }} </span>
				@if (isSelected(teamName)) {
					<button class="pi pi-times-circle cursor-pointer min-h-11 min-w-11 md:min-h-0 md:min-w-0" [attr.aria-label]="'Quitar filtro de ' + teamName" (click)="removeSelection($event, teamName)" style="font-size: 0.75rem"></button>
				}
			</p-chip>
		}
	</div>
}
