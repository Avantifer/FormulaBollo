spring.threads.virtual.enabled=true
# Los servicios mapean entidades con relaciones LAZY a DTO fuera de la transacción:
# con false falla con LazyInitializationException. Para desactivarlo hay que usar
# fetch joins/@EntityGraph o @Transactional(readOnly = true) en los servicios.
spring.jpa.open-in-view=true

server.compression.enabled=true
server.compression.min-response-size=2KB

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.cache.cachecontrol.cache-public=true

# Keep the existing JSON defaults while using Boot 4's Jackson 3 mapper.
spring.jackson.use-jackson2-defaults=true

# Caché de estadísticas pesadas: se vacía al guardar datos y al subir la versión de caché
spring.cache.type=caffeine
spring.cache.cache-names=stats
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m
